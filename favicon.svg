<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 深红圆角底色 -->
  <rect width="100" height="100" rx="22" fill="#7f1d1d" />
  <!-- 金黄色外框描边 -->
  <rect x="6" y="6" width="88" height="88" rx="18" fill="none" stroke="#facc15" stroke-width="4" />
  <!-- 上排文字：徐虾客（亮金黄） -->
  <text x="50" y="48" font-family="&#39;PingFang SC&#39;, &#39;Microsoft YaHei&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="24" font-weight="900" letter-spacing="1" fill="#facc15" text-anchor="middle">徐虾客</text>
  <!-- 下排文字：快乐长沙菜（暖象牙白） -->
  <text x="50" y="71" font-family="&#39;PingFang SC&#39;, &#39;Microsoft YaHei&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5" fill="#fef3c7" text-anchor="middle">快乐长沙菜</text>
</svg>
